name: Deploy demo and User Guide to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest

      - name: Run test suite
        run: python -m pytest tests/ -q

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/guide/package-lock.json

      - name: Install Node.js dependencies (Starlight guide)
        working-directory: docs/guide
        run: npm ci

      - name: Validate Python source (no syntax warnings)
        run: python -W error::SyntaxWarning -m compileall src/ scripts/

      - name: Build demo (sample scenarios + Starlight guide)
        run: python scripts/build_demo.py --output-dir output/demo --work-dir output/demo-build-work

      - name: Assemble artifact (guide at root, demo under /demo/)
        run: |
          mkdir -p artifact/demo
          cp -r docs/guide/dist/* artifact/
          cp -r output/demo/* artifact/demo/
          touch artifact/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: artifact

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
