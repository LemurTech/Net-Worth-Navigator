[formatting]
align_entries        = true   # aligns "=" for contiguous key-value lines (blank line / comment breaks a group)
align_comments       = true   # aligns trailing "#" comments the same way
array_auto_expand    = true
array_auto_collapse  = false
compact_arrays       = true   # no padding inside single-line brackets: ["a", "b"]
array_trailing_comma = false  # matches this file's existing multi-line arrays (no trailing comma)
indent_string        = "   "  # 3 spaces, matching existing array-item indent
indent_tables        = false
crlf                 = true   # matches this repo's other scenario TOML files (sample-a/b/couples.toml)
column_width         = 100
allowed_blank_lines  = 2
reorder_keys         = false
reorder_arrays       = false
